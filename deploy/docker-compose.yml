# Kasse - ready-made installation: only this file is needed, nothing to build.
# The image comes from GitHub Container Registry (built by the CI of this repository).
#
#   1. Change the three passwords below (the app refuses to start while one still says "change-me").
#   2. docker compose up -d
#   3. In Nginx Proxy Manager add a proxy host that forwards to  http://<this host>:8080
#      (or http://app:8080 when NPM shares a network with this stack), SSL certificate + "Force SSL".
#   4. Open the address and log in with ADMIN_USER / ADMIN_PASSWORD.
#
# Update later:  docker compose pull && docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kasse
      POSTGRES_PASSWORD: change-me-db # 1) must match the password in DATABASE_URL below
      POSTGRES_DB: kasse
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend # internal network: the database is reachable only by the app
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kasse -d kasse"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ghcr.io/einniki/kasse:dev # or a fixed version, e.g. ghcr.io/einniki/kasse:1.0.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kasse:change-me-db@db:5432/kasse # password = POSTGRES_PASSWORD above
      # the app itself runs as this restricted role (created automatically, cannot change the schema)
      APP_DB_USER: kasse_app
      APP_DB_PASSWORD: change-me-app # 2)
      # first login, created on the first start only
      ADMIN_USER: admin
      ADMIN_PASSWORD: change-me-admin # 3)
      COOKIE_SECURE: "true" # the browser talks HTTPS to the reverse proxy
      RUST_LOG: kasse=info,tower_http=info
    ports:
      - "8080:8080" # plain HTTP for the reverse proxy; do not expose it to the internet directly
    networks:
      - default
      - backend
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    internal: true

volumes:
  pgdata:
