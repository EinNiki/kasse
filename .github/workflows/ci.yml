name: CI

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Queries are checked against the committed .sqlx cache, so no database is needed to compile.
  # A stale cache (SQL changed, `cargo sqlx prepare` forgotten) fails the build here.
  SQLX_OFFLINE: "true"

jobs:
  test:
    name: Format, lint, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # superuser: the tests create a temporary database per test and a few restricted roles
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true # advisories should be looked at, but must not block a hotfix
    permissions:
      contents: read
      checks: write # the action reports its result as a check run
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # rsa is only listed in Cargo.lock through sqlx-macros-core -> sqlx-mysql.
          # We build sqlx with the postgres feature only, so it is never compiled
          # (`cargo tree -i rsa` prints nothing). No fix exists upstream.
          ignore: RUSTSEC-2023-0071

  image:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      # 1) build for this machine and keep it for the smoke test below (also checks PRs)
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: kasse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (the ready-made compose file starts and serves the login page)
        working-directory: deploy
        run: |
          # use the image built above and real passwords instead of the placeholders
          sed -i \
            -e 's|ghcr.io/einniki/kasse:dev|kasse:ci|' \
            -e "s|change-me-db|ci-db-$(openssl rand -hex 8)|g" \
            -e "s|change-me-app|ci-app-$(openssl rand -hex 8)|" \
            -e "s|change-me-admin|ci-admin-$(openssl rand -hex 8)|" \
            docker-compose.yml
          docker compose up -d
          for _ in $(seq 1 40); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/login || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          echo "login page status: $code"
          [ "$code" = "200" ] || { docker compose logs; exit 1; }
          curl -sSI -H 'X-Forwarded-Proto: https' http://localhost:8080/login | tee headers.txt
          grep -qi '^strict-transport-security' headers.txt
          grep -qi '^content-security-policy' headers.txt
          docker compose logs app | grep -q "restricted database role"
          docker compose down -v

      # 2) publish (x86_64 / amd64), not for pull requests
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        if: github.event_name != 'pull_request'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release with the ready-made compose file
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Pin the image version in the released compose file
        run: |
          mkdir -p dist
          sed "s|ghcr.io/einniki/kasse:dev|ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}|" deploy/docker-compose.yml > dist/docker-compose.yml
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/docker-compose.yml
