services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend # internal network: the database is reachable only by the app, not from outside
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      RUST_LOG: kasse=info,tower_http=info
    expose:
      - "8080" # reachable only inside the compose network, the outside world talks to "proxy"
    networks:
      - edge
      - backend
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      SITE_ALIASES: ${SITE_ALIASES:-127.0.0.1}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      HTTP_PORT: ${APP_PORT:-8080}
    ports:
      - "${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}"
      - "${APP_PORT:-8080}:${APP_PORT:-8080}" # plain HTTP, only redirects to HTTPS
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # holds the local certificate authority: keep it, devices trust its root
    networks:
      - edge
    read_only: true
    tmpfs:
      - /config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # the caddy binary carries this file capability, it fails to start without it
    security_opt:
      - no-new-privileges:true

networks:
  edge:
  backend:
    internal: true

volumes:
  pgdata:
  caddy_data:
