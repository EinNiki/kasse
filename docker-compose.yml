# Kasse. The image is pulled from GitHub Container Registry, nothing is built here.
#   cp .env.example .env     (then change the passwords)
#   docker compose up -d
# Point your reverse proxy (Nginx Proxy Manager, ...) to http://<this host>:8080.
# Update:  docker compose pull && docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend # internal network: the database is reachable only by the app, not from outside
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ghcr.io/einniki/kasse:${KASSE_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      RUST_LOG: kasse=info,tower_http=info
    ports:
      - "${APP_PORT:-8080}:8080" # plain HTTP for your reverse proxy (HTTPS is its job); never expose this to the internet
    networks:
      - default
      - backend
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    internal: true

volumes:
  pgdata:
